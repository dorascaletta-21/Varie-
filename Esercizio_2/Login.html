<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

<body>

    <nav>
        <ul>
            <li><a href="index.html">Homepage</a></li>
            <li><a href="register.html">Registrati</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <header>
        <h1>Accedi al Blog Spidy</h1>
      
    </header>

    <main>
        <section>
            <h2>Modulo per il login</h2>

            <form action="#" method="post">

                <div>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Inserisci la tua email"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Inserisci la password"
                        required
                    >
                </div>

                <button type="submit">Accedi</button>

            </form>
        </section>
    </main>

    <footer>  
        <h2>Contatti</h2>
        <p>Telefono: 051 0123456</p>
        <p>Indirizzo: Via Irnerio, Bologna</p>
        <p>Email: info@SpiderMan.com</p>
        </div>
    </footer>

</body>
</html>
